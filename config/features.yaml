# ═══════════════════════════════════════════════════════════════════════════════
# TECHNICAL INDICATORS CONFIGURATION — v2 (Lean)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Reduced from ~186 to 25 indicators per coin.
# Max TA period: EMA_50 (needs ~100 candles to converge).
# With 135 historical candles prepended, all TAs converge from step 0.
#
# Total features per coin: 25
# State dim: 20 × 25 = 500 (market) + 160 + 8 + 120 + 8 + 5 + 2 = 803
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────────
# TREND INDICATORS (6 features: ema_10, ema_20, ema_50, macd_line, macd_signal, macd_histogram)
# ─────────────────────────────────────────────────────────────────────────────────
trend:
  ema:
    periods: [10, 20, 50]

  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9

  adx:
    periods: [14]

# ─────────────────────────────────────────────────────────────────────────────────
# MOMENTUM INDICATORS (4 features: rsi_14, stoch_k_14, stoch_d_14, mfi_14)
# ─────────────────────────────────────────────────────────────────────────────────
momentum:
  rsi:
    periods: [14]

  stochastic:
    periods: [14]
    k_smooth: 3
    d_smooth: 3

  mfi:
    periods: [14]

# ─────────────────────────────────────────────────────────────────────────────────
# VOLATILITY INDICATORS (4+3 = 7 features)
# bbands at period 20 produces: bb_upper_20, bb_middle_20, bb_lower_20, bb_pctb_20, bb_width_20
# atr_14, natr_14
# ─────────────────────────────────────────────────────────────────────────────────
volatility:
  bbands:
    periods: [20]
    std_dev: 2.0

  atr:
    periods: [14]

  natr:
    periods: [14]

# ─────────────────────────────────────────────────────────────────────────────────
# VOLUME INDICATORS (3 features: obv, vwap, volume_ratio)
# ─────────────────────────────────────────────────────────────────────────────────
volume:
  obv:
    enabled: true

  vwap:
    enabled: true

  volume_ratio:
    period: 20

# ─────────────────────────────────────────────────────────────────────────────────
# PRICE FEATURES (4 features: return_1, return_5, log_return_1, close_position)
# ─────────────────────────────────────────────────────────────────────────────────
price:
  returns:
    periods: [1, 5]

  log_returns:
    periods: [1]

  close_position:
    enabled: true

# ─────────────────────────────────────────────────────────────────────────────────
# CUSTOM INDICATORS (1 feature: hazema)
# ─────────────────────────────────────────────────────────────────────────────────
custom:
  hazema:
    period: 14
